name: CI

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]

jobs:
  backend-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Cache pip dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements-dev.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          cd backend
          pip install --upgrade --only-binary :all: pydantic-core
          pip install -r requirements.txt
          pip install pytest pytest-cov httpx ruff

      - name: Lint backend with ruff
        run: |
          cd backend
          ruff check app tests

      - name: Type check backend
        run: |
          cd backend
          python -m pip install mypy
          mypy app --ignore-missing-imports --no-error-summary || true

      - name: Security check backend (bandit)
        run: |
          cd backend
          python -m pip install bandit
          bandit -r app --severity-level=medium 2>/dev/null || true

      - name: Dependency audit backend
        run: |
          cd backend
          python -m pip install pip-audit
          pip-audit --desc 2>/dev/null || true

      - name: Run backend tests with coverage
        run: |
          cd backend
          pytest --cov=app --cov-report=xml --cov-report=term tests/

      - name: Upload backend coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v3
        with:
          files: ./backend/coverage.xml
          flags: backend
          name: backend
          fail_ci_if_error: false

  frontend-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Lint frontend
        run: |
          cd frontend
          npm run lint

      - name: Type check frontend
        run: |
          cd frontend
          npx tsc --noEmit

      - name: Run frontend tests with coverage
        run: |
          cd frontend
          npm run test -- --run --coverage

      - name: Security audit frontend dependencies
        run: |
          cd frontend
          npm audit --audit-level=moderate 2>/dev/null || true

      - name: Upload frontend coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v3
        with:
          files: ./frontend/coverage/coverage-final.json
          flags: frontend
          name: frontend
          fail_ci_if_error: false
