name: Production CD

on:
  push:
    branches: [main]

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  quality-gates:
    name: Run CI checks
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  deploy-production:
    name: Deploy to AWS production
    runs-on: ubuntu-latest
    needs: quality-gates
    environment: production
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5

      - name: Build Lambda package
        run: bash infrastructure/scripts/package-lambda.sh

      - name: Configure AWS credentials through GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_PRODUCTION_ROLE_ARN }}
          aws-region: ap-south-1

      - name: Initialize production Terraform state
        working-directory: infrastructure/terraform/environments/prod
        env:
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
        run: |
          if [ -z "$TF_STATE_BUCKET" ]; then
            echo "Set the TF_STATE_BUCKET repository variable to the pre-created state bucket."
            exit 1
          fi
          terraform init \
            -backend-config="bucket=$TF_STATE_BUCKET" \
            -backend-config="key=skill-orbit/prod/terraform.tfstate" \
            -backend-config="region=ap-south-1" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"

      - name: Apply production infrastructure
        working-directory: infrastructure/terraform/environments/prod
        run: terraform apply -auto-approve

      - name: Configure production API URL
        working-directory: frontend
        env:
          NEXT_PUBLIC_USE_MOCKS: 'false'
        run: |
          echo "NEXT_PUBLIC_API_BASE_URL=$(terraform -chdir=../infrastructure/terraform/environments/prod output -raw api_url)" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_COGNITO_REGION=ap-south-1" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_COGNITO_CLIENT_ID=$(terraform -chdir=../infrastructure/terraform/environments/prod output -raw cognito_web_client_id)" >> "$GITHUB_ENV"

      - name: Compile production frontend
        working-directory: frontend
        env:
          NEXT_PUBLIC_USE_MOCKS: 'false'
        run: |
          npm ci
          npm run build

      - name: Publish frontend to production
        working-directory: infrastructure/terraform/environments/prod
        run: |
          aws s3 sync ../../../../frontend/out/ "s3://$(terraform output -raw frontend_bucket_name)" --delete
          aws cloudfront create-invalidation \
            --distribution-id "$(terraform output -raw cloudfront_distribution_id)" \
            --paths "/*"
