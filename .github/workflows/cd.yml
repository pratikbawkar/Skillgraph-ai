name: CD

on:
  push:
    branches: [develop]

jobs:
  ci-gate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Wait for CI to complete
        uses: actions/github-script@v7
        with:
          script: |
            const { data: checkRuns } = await github.rest.checks.listForRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.sha,
              check_name: 'CI'
            });

            const ciRun = checkRuns.check_runs.find(run => run.name === 'CI');
            if (!ciRun || ciRun.conclusion !== 'success') {
              throw new Error('CI workflow must pass before deploying');
            }

  deploy-verification:
    runs-on: ubuntu-latest
    needs: ci-gate
    if: success()

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Verify backend health
        run: |
          cd backend
          python -m pip install --no-build-isolation -q -r requirements.txt
          python -m pytest tests/integration/test_health_api.py -v

      - name: Verify frontend build
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Log deployment info
        run: |
          echo "✅ Deployment verification passed!"
          echo "Commit: ${{ github.sha }}"
          echo "Branch: ${{ github.ref }}"
          echo "Ready for Phase 2 AWS deployment"

  push-to-origin:
    runs-on: ubuntu-latest
    needs: deploy-verification
    if: success()

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.email "ci@skillgraph.local"
          git config user.name "SkillGraph CI"

      - name: Verify remote connection
        run: |
          git remote -v
          git log -1 --oneline

      - name: Log successful deployment
        run: |
          echo "✅ All CI/CD checks passed!"
          echo "✅ Code is ready for Phase 2 deployment"
          echo "Deployed commit: ${{ github.sha }}"
          git log --oneline -5
